# Nord UI: pearl / steel blue / carrot / lime
font pango:@UI_FONT@ 11
output * bg @DATA@/nord-sway/assets/wallpaper.png fill
client.focused          #52788e #e5ebed #203c4e #8cc63f #52788e
client.focused_inactive #a9b9c0 #ecf0ef #526570 #d5dfe1 #a9b9c0
client.unfocused        #a9b9c0 #e1e7e8 #657781 #c8d4d9 #a9b9c0
client.urgent           #c26d2b #ffdeb1 #713618 #ffac40 #c26d2b
client.background #22486d
default_border normal 2
default_floating_border normal 2
titlebar_padding 12 6
titlebar_border_thickness 1
gaps inner 12
gaps outer 18
smart_gaps off
hide_edge_borders none
bar bar-0 mode invisible
exec_always @BIN@/nord-services
bindsym --no-warn Print exec @BIN@/nord-shot
bindsym --no-warn $mod+Return exec env QT_QPA_PLATFORMTHEME=kde foot
bindsym $mod+F1 exec foot --app-id=nord-guide --title="Nord / desktop guide" @BIN@/nord-guide
bindsym $mod+n exec makoctl dismiss
bindsym $mod+Shift+n exec makoctl restore
bindsym $mod+Escape exec @BIN@/nord-session
for_window [app_id="nord-guide"] floating enable, resize set 920 680, move position center
for_window [window_role="pop-up"] floating enable

# Optional machine-specific output, input, and keybinding settings.
include "@CONFIG@/sway/nord-local.conf"
